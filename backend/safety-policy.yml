# Safety Security Configuration — Swaya.me backend
#
# Used by .github/workflows/dependency-scanning.yml (`safety check --policy-file`).
#
# History: when this scanner was first wired up (2026-08-22) it found 65 pre-existing
# findings across 22 packages, which were listed here as time-boxed ignores (90-day
# expiry) so CI stayed green while the backlog was worked through. That backlog was
# cleared by dependency upgrades on 2026-10-23, so the ignore list is now empty and
# `safety check` against backend/requirements.txt reports 0 vulnerabilities.
#
# Any vulnerability reported from now on fails the build immediately. If one ever
# can't be fixed right away, add it under ignore-vulnerabilities with a real reason
# and a short `expires` date — never an open-ended ignore. Example:
#
#     ignore-vulnerabilities:
#         SFTY-YYYYMMDD-NNNNN:
#             reason: <why it can't be fixed yet / why it doesn't apply>
#             expires: 'YYYY-MM-DD'
security:
    ignore-unpinned-requirements: True
    ignore-cvss-severity-below: 0
    ignore-cvss-unknown-severity: False
    ignore-vulnerabilities: {}
    continue-on-vulnerability-error: False
