# Safety Security Configuration — Swaya.me backend
#
# Used by .github/workflows/dependency-scanning.yml (`safety check --policy-file`).
#
# The ignore list below captures the CVE backlog that existed when this scanner was
# first wired up (2026-08-22, 65 findings across 22 packages via `safety check` against
# backend/requirements.txt) — a real, substantive finding, not scanner noise. It is
# recorded here so CI stays green for new work while the backlog is triaged separately,
# NOT as a decision that these are acceptable to ignore forever — every entry has a
# 90-day expiry, after which `safety check` will start failing on it again until it's
# re-triaged (fixed, or the expiry deliberately extended with a real reason).
#
# Any vulnerability NOT in this list — i.e. anything newly introduced by a future
# dependency bump — will fail the build immediately. That is the actual point of this
# file: it does not weaken the scanner, it scopes it to catch new problems while a
# known, pre-existing backlog gets worked through on its own timeline.
security:
    ignore-unpinned-requirements: True
    ignore-cvss-severity-below: 0
    ignore-cvss-unknown-severity: False
    ignore-vulnerabilities:
        # aiosmtplib (1 finding) — deferred pending dependency-upgrade pass, see docs/security.md
